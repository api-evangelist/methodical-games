aid: methodical-games
name: Methodical Games
description: >-
  Methodical Games is an independent AAA game development studio building
  award-winning multiplayer games, describing itself as "built by developers,
  for developers." Founded by veterans of Infinity Ward, Respawn Entertainment,
  Epic Games and Santa Monica Studio, its lean team has shipped and shaped
  franchises including Call of Duty, Titanfall, Apex Legends, Fortnite, Gears of
  War and God of War Ragnarok. The studio emphasizes a developer-driven process
  of fundamentals, quick iteration and collaboration to craft immersive,
  long-lived multiplayer experiences. It was surfaced as a portfolio company of
  Lightspeed Venture Partners and added to the API Evangelist network. As a game
  studio it publishes no public developer API, SDK, or developer portal surface
  at this time; this profile captures its identity and public web presence.
